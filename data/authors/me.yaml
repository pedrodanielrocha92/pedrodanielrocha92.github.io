bio: "Pedro Daniel Rocha is a Computer Vision Research Scientist at the Instituto de Telecomunicações and a Ph.D. candidate at the University of Coimbra, Portugal. His work explores how AI-based Computer Vision can support Automated Inspection. With over a decade of Industrial Experience, he brings an Engineering perspective to Applied Research, driven by an interest in developing Intelligent Vision Systems that address real-world challenges.\ \n"
